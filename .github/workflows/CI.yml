name: DotNetTools CI

run-name: CI for PR ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - 'dev'
      - 'test/**'
      - 'master'
      - 'main'

jobs:
  build:
    permissions: read-all
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        dotnet-version: [ '9.x', '8.x' ]
        configuration: [ 'Debug' ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check project version
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.actor != 'dependabot[bot]' }}
        run: bash .github/scripts/check_version_changes.sh

      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --verbosity normal --no-restore --configuration ${{ matrix.configuration }}

      - name: Run backend tests
        run: dotnet test --no-restore --verbosity normal --configuration ${{ matrix.configuration }}